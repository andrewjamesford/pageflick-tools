[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pageflick-tools"
version = "1.0.0"
description = "Optional macOS CLI and stdio MCP companion for the installed PageFlick app"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://getpageflick.com"
Repository = "https://github.com/andrewjamesford/pageflick-tools"

[tool.setuptools]
py-modules = []
script-files = ["scripts/pageflick"]
